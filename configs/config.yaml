server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    driver: postgres
    source: ${DATABASE_SOURCE:postgres://postgres:postgres@127.0.0.1:5432/test?sslmode=disable}
    # Development conveniences. Keep both false in production and apply schema
    # changes as a separate reviewed step.
    debug: true
    # Native PostgreSQL enum types are managed by services/todo/migrations/.
    auto_migrate: false
  redis:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    read_timeout: 0.2s
    write_timeout: 0.2s
